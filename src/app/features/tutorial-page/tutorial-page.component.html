<article class="container-xl tutorial-page">
  <app-breadcrumb [items]="[{ label: page.category, route: page.category === 'Java' ? '/java-tutorial-overview' : '/spring-boot' }, { label: page.title }]" />
  <app-page-header [category]="page.category" [title]="page.title" [description]="page.description" />
  @for (section of page.sections; track section.heading) {
    <section class="tutorial-section">
      <h2>{{ section.heading }}</h2>
      @for (paragraph of section.paragraphs; track paragraph) { <p>{{ paragraph }}</p> }
      @if (section.code) { <app-code-block language="java" [code]="section.code" /> }
    </section>
  }
  <a class="btn btn-outline-primary mt-3" [routerLink]="page.category === 'Java' ? '/java-tutorial-overview' : '/spring-boot'"><i class="bi bi-arrow-left"></i> Back to {{ page.category }}</a>
</article>
