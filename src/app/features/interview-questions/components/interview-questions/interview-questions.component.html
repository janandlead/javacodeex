<article class="interview-page container-xl">
  <div class="mobile-toolbar"><button type="button" class="btn btn-primary" [attr.aria-expanded]="sidebarOpen()" (click)="toggleSidebar(true)"><i class="bi bi-list" aria-hidden="true"></i> Browse topics</button></div>
  <div class="interview-layout" [class.sidebar-collapsed]="!sidebarOpen()">
    <app-topic-sidebar [topics]="topics()" [selectedTopicId]="selectedTopicId()" [isOpen]="sidebarOpen()" (topicSelected)="selectTopic($event)" (sidebarToggled)="toggleSidebar($event)" />
    <section class="question-panel" aria-label="Interview questions">
      <div class="topic-intro"><span class="topic-icon"><i [class]="selectedTopic()?.icon ?? 'bi bi-question-circle'" aria-hidden="true"></i></span><div><h1>{{ selectedTopicName() }} Interview Questions</h1><p>{{ selectedTopic()?.description }}</p></div></div>
      <form class="filter-card" aria-label="Filter interview questions"><div class="search-field"><label for="question-search">Search questions</label><div class="input-group"><span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span><input id="question-search" class="form-control" type="search" [formControl]="searchControl" placeholder="Search by question, tag, or difficulty" /></div></div><div class="difficulty-field"><label for="difficulty-filter">Difficulty</label><select id="difficulty-filter" class="form-select" [formControl]="difficultyControl"><option value="All">All</option><option value="Beginner">Beginner</option><option value="Intermediate">Intermediate</option><option value="Advanced">Advanced</option></select></div></form>
      <app-question-accordion [questions]="filteredQuestions()" [topicName]="selectedTopicName()" />
    </section>
  </div>
</article>
