<main class="container-xl py-5"><section class="spring-hero page-hero"><p class="spring-pill">PostgreSQL</p><h1>PostgreSQL AVG</h1><p>Calculate the average of numeric values.</p></section><h2>Calculate an average</h2><p><code>AVG</code> ignores null values and returns the arithmetic mean.</p><pre><code>SELECT AVG(year) AS average_year
FROM products;</code></pre><p>Use <code>ROUND</code> when you want to control the number of decimal places in a numeric result.</p></main>
