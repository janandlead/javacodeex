<main class="container-xl py-5"><section class="spring-hero page-hero"><p class="spring-pill">PostgreSQL</p><h1>PostgreSQL BETWEEN</h1><p>Filter values within an inclusive range.</p></section><h2>Use BETWEEN</h2><pre><code>SELECT * FROM products
WHERE year BETWEEN 2024 AND 2026;</code></pre><p><code>BETWEEN</code> includes both boundary values. For dates, use clear date or timestamp literals and consider the time component.</p></main>
