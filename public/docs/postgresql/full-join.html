<main class="container-xl py-5"><section class="spring-hero page-hero"><p class="spring-pill">PostgreSQL</p><h1>PostgreSQL FULL JOIN</h1><p>Keep matching and unmatched rows from both tables.</p></section><h2>Use FULL JOIN</h2><pre><code>SELECT p.name, c.name AS category
FROM products AS p
FULL JOIN categories AS c
  ON c.id = p.category_id;</code></pre><p>When a row has no match, the columns from the other table contain <code>NULL</code>.</p></main>
