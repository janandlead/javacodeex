<main class="container-xl py-5"><section class="spring-hero page-hero"><p class="spring-pill">PostgreSQL</p><h1>PostgreSQL GROUP BY</h1><p>Group rows with the same value for aggregate calculations.</p></section><h2>Group and count</h2><pre><code>SELECT year, COUNT(*) AS product_count
FROM products
GROUP BY year
ORDER BY year;</code></pre><p>Every selected column that is not aggregated must be included in the <code>GROUP BY</code> clause.</p></main>
