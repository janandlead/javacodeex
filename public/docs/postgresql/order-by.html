<main class="container-xl py-5"><section class="spring-hero page-hero"><p class="spring-pill">PostgreSQL</p><h1>PostgreSQL ORDER BY</h1><p>Sort PostgreSQL results in ascending or descending order.</p></section><h2>Sort results</h2><pre><code>SELECT name, year
FROM products
ORDER BY year DESC, name ASC;</code></pre><p><code>ASC</code> is ascending and is the default. <code>DESC</code> is descending. Add <code>NULLS FIRST</code> or <code>NULLS LAST</code> when null ordering matters.</p></main>
