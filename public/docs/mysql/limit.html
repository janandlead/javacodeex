<main class="container-xl py-5"><section class="spring-hero page-hero"><p class="spring-pill">MySQL SQL</p><h1>MySQL LIMIT</h1><p>Restrict the number of rows returned.</p></section><h2>Limit and paginate</h2><pre><code>SELECT * FROM products
ORDER BY id
LIMIT 10 OFFSET 20;</code></pre><p><code>LIMIT</code> sets the maximum row count and <code>OFFSET</code> skips rows. Use <code>ORDER BY</code> for stable pagination.</p></main>
