<main class="container-xl py-5"><section class="spring-hero page-hero"><p class="spring-pill">MySQL Auto Increment</p><h1>MySQL Auto Increment</h1><p>Generate sequential numeric identifiers automatically.</p></section><pre><code>CREATE TABLE products (
  id INT AUTO_INCREMENT PRIMARY KEY,
  name VARCHAR(255) NOT NULL
);</code></pre><p>When an INSERT omits <code>id</code>, MySQL generates a value for the new row.</p></main>
