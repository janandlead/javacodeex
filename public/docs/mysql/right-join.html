<main class="container-xl py-5"><section class="spring-hero page-hero"><p class="spring-pill">MySQL SQL</p><h1>MySQL RIGHT JOIN</h1><p>Keep every row from the right table.</p></section><pre><code>SELECT p.name, c.name AS category
FROM products p
RIGHT JOIN categories c ON c.id = p.category_id;</code></pre><p>Categories without products remain. Rewriting the query with a LEFT JOIN is often easier to read.</p></main>
