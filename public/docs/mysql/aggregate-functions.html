<main class="container-xl py-5"><section class="spring-hero page-hero"><p class="spring-pill">MySQL SQL</p><h1>MySQL Aggregate Functions</h1><p>Calculate one result from many rows.</p></section><h2>Aggregate data</h2><pre><code>SELECT category, COUNT(*) AS product_count,
       AVG(price) AS average_price
FROM products
GROUP BY category;</code></pre><p>Common aggregate functions include <code>MIN</code>, <code>MAX</code>, <code>COUNT</code>, <code>SUM</code>, and <code>AVG</code>.</p></main>
