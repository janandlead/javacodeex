<main class="container-xl py-5"><section class="spring-hero page-hero"><p class="spring-pill">MySQL SQL</p><h1>MySQL LEFT JOIN</h1><p>Keep every row from the left table.</p></section><pre><code>SELECT p.name, c.name AS category
FROM products p
LEFT JOIN categories c ON c.id = p.category_id;</code></pre><p>Products without a category remain, with NULL values for category columns.</p></main>
