<main class="container-xl py-5"><section class="spring-hero page-hero"><p class="spring-pill">MySQL SQL</p><h1>MySQL INNER JOIN</h1><p>Return rows that match in both tables.</p></section><pre><code>SELECT p.name, c.name AS category
FROM products p
INNER JOIN categories c ON c.id = p.category_id;</code></pre><p>Rows without a matching category are excluded.</p></main>
