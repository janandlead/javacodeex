<main class="container-xl py-5"><section class="spring-hero page-hero"><p class="spring-pill">MySQL SQL</p><h1>MySQL Self Join</h1><p>Join a table to itself using different aliases.</p></section><pre><code>SELECT e.name, m.name AS manager
FROM employees e
LEFT JOIN employees m ON m.id = e.manager_id;</code></pre><p>Self joins are useful for hierarchical data such as employees and managers.</p></main>
