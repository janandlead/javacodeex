<main class="container-xl py-5"><section class="spring-hero page-hero"><p class="spring-pill">MySQL SQL</p><h1>MySQL EXISTS</h1><p>Test whether a subquery returns at least one row.</p></section><pre><code>SELECT p.name
FROM products p
WHERE EXISTS (SELECT 1 FROM orders o WHERE o.product_id = p.id);</code></pre><p>EXISTS stops being interested in additional matching rows once one match is found.</p></main>
