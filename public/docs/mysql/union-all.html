<main class="container-xl py-5"><section class="spring-hero page-hero"><p class="spring-pill">MySQL SQL</p><h1>MySQL UNION ALL</h1><p>Combine SELECT results while keeping duplicates.</p></section><pre><code>SELECT email FROM customers
UNION ALL
SELECT email FROM subscribers;</code></pre><p><code>UNION ALL</code> usually avoids duplicate-removal work, but the result may contain repeated rows.</p></main>
