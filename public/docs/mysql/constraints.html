<main class="container-xl py-5"><section class="spring-hero page-hero"><p class="spring-pill">MySQL Database</p><h1>MySQL Constraints</h1><p>Enforce valid relationships and values in a MySQL table.</p></section><p>Constraints are database rules such as <code>NOT NULL</code>, <code>UNIQUE</code>, <code>PRIMARY KEY</code>, <code>FOREIGN KEY</code>, <code>CHECK</code>, and <code>DEFAULT</code>.</p><pre><code>CREATE TABLE users (
  id INT PRIMARY KEY,
  email VARCHAR(255) UNIQUE NOT NULL
);</code></pre></main>
